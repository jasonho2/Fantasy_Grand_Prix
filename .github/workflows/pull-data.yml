name: Pull fantasy data

# Keeps the live site's Turso database fresh without anyone running the
# pipeline by hand, for every league configured in config.example.json
# (ESPN and/or Sleeper). Each run re-fetches and upserts -- there's no
# separate "corrections" step -- but which SEASONS a given run covers
# depends on which trigger fired it (see the FULL_PULL step below):
# the frequent game-day schedule only re-pulls each league's current
# season, while a once-daily schedule (and manual runs, optionally)
# do a full pull of every configured season. Re-fetching a season from
# a year or two ago -- one ESPN API call per played week, every time --
# on every single frequent run was pure waste: that data is long since
# final and was never going to change, and doing it anyway is what made
# every run take 12-37+ minutes instead of well under one, which in turn
# meant runs piled up faster than they finished and the site's "Data as
# of" indicator stalled instead of moving every 5 minutes as intended.
#
# Schedule: every 5 minutes (current season only), but only on/around the
# NFL's primary game days (Thu/Sun/Mon) to avoid burning Actions minutes
# the rest of the week, plus once daily (every season) to catch older-
# season corrections and to cover the non-game days the frequent schedule
# skips. Adjust the cron expressions below, or just use "Run workflow" in
# the Actions tab for an on-demand pull any time.
#
# Every-5-minutes is specifically so the Matchups page's live in-progress
# scores (see platforms/espn.py's live_week detection, and the
# live_matchups table in db.py) stay close to real-time during games, not
# just so a stat correction lands a little faster -- a decided week would
# show up just as correctly on a slower cadence. GitHub's own scheduling
# is best-effort, not exact -- a run can slip by a few minutes during
# periods of high platform load, so "every 5 minutes" means "about every
# 5 minutes," not a hard guarantee.
#
# GitHub Actions cron is UTC, but this league runs on Pacific time (see
# Nav.js's formatDataAsOf). A ~5:15pm PT Thursday/Monday night kickoff is
# already past midnight UTC -- 00:15 UTC the *next* day (Fri/Tue) -- so
# the entire TNF/MNF game (not just its tail end) falls on a UTC weekday
# the day-of-week list below doesn't include, and the first cron entry
# alone would stop refreshing right as those games kick off. Sunday
# doesn't have this gap: Sunday Night Football's ~5:20pm PT kickoff is
# 00:20 UTC *Monday*, which the first entry already covers via day 1.
# The second cron entry below patches the TNF/MNF gap with a narrow
# early-UTC-morning window on the following day (Fri/Tue) -- wide enough
# (00:00-05:59 UTC) to cover a kickoff anywhere from PDT (UTC-7) to PST
# (UTC-8, after the season's fall-back DST change) through a game running
# long with overtime, without running all day on days with no game.
on:
  schedule:
    - cron: "*/5 * * * 0,1,4" # Sun/Mon/Thu, all day UTC -- current season only
    - cron: "*/5 0-5 * * 2,5" # early UTC hours Tue/Fri -- MNF/TNF spillover past UTC midnight -- current season only
    - cron: "0 9 * * *" # once daily, ~2am Pacific (any day, any time of year) -- full pull, every configured season
  workflow_dispatch:
    inputs:
      full_pull:
        description: "Pull every configured season, not just the current one (slower)"
        type: boolean
        default: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install libsql

      - name: Check required secrets are set
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          # db.py treats an empty TURSO_DATABASE_URL the same as "not set"
          # and silently falls back to writing a LOCAL sqlite file inside
          # this ephemeral runner -- which then vanishes when the job ends,
          # having touched Turso not at all. That failure mode looks
          # identical to success (exit code 0, no error in the log), so
          # fail loudly here instead if either secret is missing.
          if [ -z "$TURSO_DATABASE_URL" ] || [ -z "$TURSO_AUTH_TOKEN" ]; then
            echo "::error::TURSO_DATABASE_URL and/or TURSO_AUTH_TOKEN repo secrets are not set." \
                 "Add them under Settings -> Secrets and variables -> Actions, then rerun this workflow." \
                 "Without them, the pipeline runs against a throwaway local file instead of your real database."
            exit 1
          fi

      - name: Build config.json (structure from config.example.json, secrets from GitHub)
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: |
          python3 - <<'PY'
          import json
          import os

          with open("config.example.json") as f:
              cfg = json.load(f)
          # Only ESPN leagues need credentials injected -- Sleeper's API is
          # public read-only, so any "platform": "sleeper" entries in
          # config.example.json are left as-is.
          for league in cfg.get("leagues", []):
              if league.get("platform") == "espn":
                  league["espn_s2"] = os.environ["ESPN_S2"]
                  league["espn_swid"] = os.environ["ESPN_SWID"]
          with open("config.json", "w") as f:
              json.dump(cfg, f)
          PY

      - name: Run pipeline (loads straight into Turso)
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          # True for the once-daily "0 9 * * *" schedule (see the file's
          # top comment) or a manual run with the full_pull checkbox
          # ticked; false for every other trigger, including the site's
          # own Refresh Now button (api/refresh/route.js dispatches with
          # no inputs, which default to full_pull: false) -- so that
          # button stays the fast, current-season-only path it's meant
          # for, and the "Run workflow" button in the Actions tab can
          # still be used for an occasional deliberate full re-sync.
          FULL_PULL: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 9 * * *') || github.event.inputs.full_pull == 'true' }}
        run: |
          if [ "$FULL_PULL" = "true" ]; then
            echo "Full pull: fetching every configured season for every league."
            python pipeline.py --config config.json
          else
            echo "Current-season-only pull (frequent game-day refresh)."
            python pipeline.py --config config.json --current-season-only
          fi
